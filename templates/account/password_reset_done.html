{% extends "appname/base.html" %}
{% load static i18n %}

{% block title %}Пароль изменён — AnimeManga{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="auth-particles"></div>

    <div class="auth-card" style="grid-template-columns: 1fr; max-width: 520px; text-align: center;">
        <div class="auth-main">
            <div style="font-size: 60px; margin-bottom: 10px;">✅</div>
            <h1>Пароль изменён!</h1>
            <p class="auth-sub">Теперь можешь войти с новым паролем</p>

            <div class="auth-links" style="margin-top: 25px;">
                <p><a href="{% url 'account_login' %}" class="btn-primary"
                       style="display:inline-block; padding: 12px 30px;">Войти →</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
