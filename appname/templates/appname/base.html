<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AnimeManga{% endblock %}</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background:#0f0f1a; color:#e0e0e0; min-height:100vh; }
        header { background:#1a1a2e; padding:15px 30px; box-shadow:0 2px 10px rgba(0,0,0,.3);
                 position:sticky; top:0; z-index:100; }
        nav { display:flex; align-items:center; gap:30px; max-width:1400px; margin:0 auto; flex-wrap:wrap; }
        .logo { font-size:24px; font-weight:bold; color:#a78bfa; text-decoration:none; }
        nav a { color:#e0e0e0; text-decoration:none; }
        nav a:hover { color:#a78bfa; }
        .search-form { margin-left:auto; }
        .search-form input { padding:8px 15px; border-radius:20px; border:1px solid #333;
                             background:#0f0f1a; color:#e0e0e0; width:250px; }
        main { max-width:1400px; margin:30px auto; padding:0 30px; }
        h1, h2 { margin-bottom:20px; color:#fff; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
                gap:20px; margin-bottom:40px; }
        .card { background:#1a1a2e; border-radius:12px; overflow:hidden;
                transition:transform .2s; text-decoration:none; color:inherit; }
        .card:hover { transform:translateY(-5px); box-shadow:0 10px 25px rgba(167,139,250,.3); }
        .card img { width:100%; aspect-ratio:3/4; object-fit:cover; background:#2a2a3e; }
        .card-body { padding:10px; }
        .card-title { font-size:14px; font-weight:600; overflow:hidden;
                      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
        .card-meta { font-size:12px; color:#888; margin-top:5px; }
        .btn { display:inline-block; padding:10px 20px; background:#a78bfa; color:#fff;
               border:none; border-radius:8px; cursor:pointer; text-decoration:none; }
        .btn:hover { background:#8b5cf6; }
        .filters { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
        .filters select, .filters input { padding:8px 12px; background:#1a1a2e;
                                          border:1px solid #333; color:#e0e0e0; border-radius:8px; }
        .pagination { display:flex; gap:10px; justify-content:center; margin:30px 0; }
        .pagination a, .pagination span { padding:8px 15px; background:#1a1a2e;
                                          border-radius:8px; color:#e0e0e0; text-decoration:none; }
        .pagination .current { background:#a78bfa; }
        .detail-header { display:flex; gap:30px; margin-bottom:30px; flex-wrap:wrap; }
        .detail-poster { width:300px; border-radius:12px; }
        .tag { display:inline-block; padding:4px 10px; background:#2a2a3e; border-radius:12px;
               font-size:12px; margin:0 5px 5px 0; text-decoration:none; color:#e0e0e0; }
        .list-box { background:#1a1a2e; border-radius:12px; padding:20px; margin-bottom:30px; }
        .list-item { display:flex; justify-content:space-between; padding:12px 15px;
                     border-bottom:1px solid #2a2a3e; color:#e0e0e0; text-decoration:none; }
        .list-item:hover { background:#2a2a3e; }
        .list-item:last-child { border-bottom:none; }
        .player { width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; margin-bottom:20px; }
        .reader { display:flex; flex-direction:column; align-items:center; gap:5px; }
        .reader img { max-width:900px; width:100%; display:block; }
        footer { text-align:center; padding:30px; color:#666; border-top:1px solid #1a1a2e; margin-top:50px; }
        /* ===== Карусель ===== */
        .carousel {
            position: relative;
            margin-bottom: 50px;
            overflow: hidden;
            border-radius: 16px;
            background: #1a1a2e;
        }
        .carousel h2 { padding: 20px 20px 10px; margin: 0; }
        .carousel-track {
            display: flex;
            transition: transform .6s ease;
            width: 100%;
        }
        .carousel-slide {
            flex: 0 0 100%;
            width: 100%;
            position: relative;
        }
        .carousel-link {
            display: block;
            position: relative;
            aspect-ratio: 16/7;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
        }
        .carousel-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            filter: brightness(.75);
        }
        .carousel-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #a78bfa;
        }
        .carousel-overlay {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 30px 40px;
            background: linear-gradient(to top, rgba(15,15,26,.95), transparent);
            z-index: 2;
        }
        .carousel-rank {
            display: inline-block;
            background: #a78bfa;
            color: #fff;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .carousel-overlay h3 {
            font-size: 32px;
            margin: 0 0 8px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,.7);
        }
        .carousel-meta { color: #ddd; font-size: 15px; }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(26,26,46,.7);
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            z-index: 5;
            transition: background .2s;
        }
        .carousel-btn:hover { background: #a78bfa; }
        .carousel-prev { left: 15px; }
        .carousel-next { right: 15px; }
        .carousel-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 5;
        }
        .carousel-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,.4);
            cursor: pointer;
            transition: background .2s, width .2s;
        }
        .carousel-dots .dot.active {
            background: #a78bfa;
            width: 28px;
            border-radius: 5px;
        }

        /* ===== Красивая страница выхода ===== */
        .logout-hero {
            position: relative;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            border-radius: 24px;
            background: #0a0a14;
            padding: 60px 20px;
            isolation: isolate;
        }

        /* Анимированные "орбы" на фоне */
        .logout-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .55;
            animation: orbFloat 18s ease-in-out infinite;
        }
        .orb-1 {
            width: 420px; height: 420px;
            background: #a78bfa;
            top: -80px; left: -80px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 380px; height: 380px;
            background: #ec4899;
            bottom: -100px; right: -60px;
            animation-delay: -6s;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: #06b6d4;
            top: 40%; left: 55%;
            animation-delay: -12s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            33%      { transform: translate(40px,-30px) scale(1.1); }
            66%      { transform: translate(-30px,30px) scale(.95); }
        }

        /* Частицы */
        .particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            bottom: -10px;
            background: #fff;
            border-radius: 50%;
            animation: rise linear infinite;
            box-shadow: 0 0 6px rgba(255,255,255,.8);
        }
        @keyframes rise {
            0%   { transform: translateY(0) scale(1);   opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-110vh) scale(.4); opacity: 0; }
        }

        /* Аватар в центре */
        .logout-avatar-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            z-index: 3;
            margin-bottom: 30px;
            animation: popIn .8s cubic-bezier(.2,.9,.3,1.4);
        }
        .logout-avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            z-index: 3;
            box-shadow: 0 0 0 6px rgba(255,255,255,.08),
                        0 20px 50px rgba(167,139,250,.5);
        }
        .avatar-ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 2px dashed rgba(167,139,250,.7);
            animation: spinSlow 20s linear infinite;
            z-index: 1;
        }
        .avatar-glow {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167,139,250,.6), transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes spinSlow {
            to { transform: rotate(360deg); }
        }
        @keyframes pulseGlow {
            0%,100% { transform: scale(1); opacity: .7; }
            50%     { transform: scale(1.1); opacity: 1; }
        }
        @keyframes popIn {
            0%   { opacity: 0; transform: scale(.5) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Текст */
        .logout-title {
            position: relative;
            z-index: 3;
            font-size: 46px;
            font-weight: 800;
            color: #fff;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #a78bfa, #ec4899, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientShift 6s ease infinite,
                    fadeInUp .9s .2s both;
            letter-spacing: -1px;
        }
        @keyframes gradientShift {
            0%,100% { background-position: 0% 50%; }
            50%     { background-position: 100% 50%; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .logout-sub {
            position: relative;
            z-index: 3;
            color: #b8b8d0;
            font-size: 16px;
            margin-bottom: 40px;
            animation: fadeInUp .9s .35s both;
        }

        /* Кнопки */
        .logout-actions {
            position: relative;
            z-index: 3;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp .9s .5s both;
        }
        .logout-btn {
            padding: 14px 26px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, background .2s;
            font-family: inherit;
            display: inline-block;
        }
        .logout-btn:hover { transform: translateY(-2px); }
        .logout-btn-primary {
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
            box-shadow: 0 10px 25px rgba(167,139,250,.4);
        }
        .logout-btn-primary:hover {
            box-shadow: 0 15px 35px rgba(167,139,250,.6);
        }
        .logout-btn-ghost {
            background: rgba(255,255,255,.06);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,.12);
        }
        .logout-btn-ghost:hover {
            background: rgba(255,255,255,.12);
            color: #fff;
        }

        /* ===== Страницы входа/регистрации ===== */
        .auth-page {
            position: relative;
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 24px;
            background: #0a0a14;
            padding: 40px 20px;
            isolation: isolate;
        }

        /* Фоновые орбы (те же, что в logout) */
        .auth-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Частицы */
        .auth-particles {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .auth-particles .particle {
            position: absolute;
            bottom: -10px;
            background: #fff;
            border-radius: 50%;
            animation: rise linear infinite;
            box-shadow: 0 0 6px rgba(255,255,255,.8);
        }

        /* Карточка */
        .auth-card {
            position: relative;
            z-index: 3;
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 30px;
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 22px;
            padding: 40px;
            max-width: 760px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            animation: popIn .7s cubic-bezier(.2,.9,.3,1.4);
        }

        .auth-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .auth-avatar-wrap {
            position: relative;
            width: 150px;
            height: 150px;
        }
        .auth-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 3;
            box-shadow: 0 0 0 6px rgba(255,255,255,.06),
                        0 15px 40px rgba(167,139,250,.45);
        }
        .auth-avatar-wrap .avatar-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px dashed rgba(167,139,250,.6);
            animation: spinSlow 22s linear infinite;
            z-index: 1;
        }
        .auth-avatar-wrap .avatar-glow {
            position: absolute;
            inset: -25px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167,139,250,.55), transparent 70%);
            animation: pulseGlow 3s ease-in-out infinite;
            z-index: 0;
        }

        .auth-side .auth-welcome {
            color: #fff;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
            opacity: .9;
        }
        .auth-side .auth-hint {
            color: #a0a0b8;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .auth-main { display: flex; flex-direction: column; }
        .auth-main h1 {
            font-size: 28px;
            margin: 0 0 6px;
            color: #fff;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-main .auth-sub {
            color: #a0a0b8;
            font-size: 14px;
            margin-bottom: 22px;
        }

        /* Поля */
        .auth-main form { display: flex; flex-direction: column; gap: 14px; }
        .auth-main label {
            display: block;
            font-size: 13px;
            color: #a0a0b8;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .auth-main input[type="text"],
        .auth-main input[type="email"],
        .auth-main input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .auth-main input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.15);
            background: rgba(10, 10, 20, 0.9);
        }
        .auth-main input::placeholder { color: #555568; }

        /* Ошибки */
        .auth-errors {
            background: rgba(220, 38, 38, 0.12);
            border: 1px solid rgba(220, 38, 38, 0.35);
            color: #ffb0b0;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 6px;
        }
        .auth-errors ul { margin: 0; padding-left: 18px; }

        /* Кнопка */
        .auth-main button[type="submit"],
        .auth-main .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 10px 25px rgba(167, 139, 250, .35);
        }
        .auth-main button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(167, 139, 250, .55);
        }

        /* Ссылки */
        .auth-links {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #a0a0b8;
        }
        .auth-links a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-links a:hover { text-decoration: underline; }
        .auth-links p { margin: 6px 0; }

        /* Чекбокс «запомнить» */
        .auth-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c0c0d8;
            font-size: 14px;
            cursor: pointer;
        }
        .auth-check input { width: auto; }

        /* Мобилка */
        @media (max-width: 620px) {
            .auth-card {
                grid-template-columns: 1fr;
                padding: 26px;
                gap: 18px;
            }
            .auth-avatar-wrap { width: 110px; height: 110px; }
            .auth-main h1 { font-size: 24px; }
        }
        .search-form { margin-left: auto; }
        .user-menu { position: relative; }
        .user-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a3e;
            color: #e0e0e0;
            border: none;
            padding: 6px 12px 6px 6px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: background .2s;
        }
        .user-btn:hover { background: #3a3a52; }
        .user-avatar-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #fff;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-caret { font-size: 10px; color: #888; }
        .user-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            min-width: 200px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
            z-index: 200;
        }
        .user-dropdown.open { display: block; }
        .user-dropdown a {
            display: block;
            padding: 10px 14px;
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            font-size: 14px;
        }
        .user-dropdown a:hover { background: #2a2a3e; color: #a78bfa; }
        .user-dropdown hr {
            border: none;
            border-top: 1px solid #2a2a3e;
            margin: 6px 0;
        }
        .btn-login, .btn-register {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-login {
            background: #2a2a3e;
            color: #e0e0e0;
            margin-right: 6px;
        }
        .btn-login:hover { background: #3a3a52; }
        .btn-register {
            background: #a78bfa;
            color: #fff;
        }
        .btn-register:hover { background: #8b5cf6; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'appname:home' %}" class="logo">AnimeManga</a>
            <a href="{% url 'appname:anime_list' %}">Аниме</a>
            <a href="{% url 'appname:manga_list' %}">Манга</a>
            <a href="{% url 'appname:shops_map' %}">Магазины</a>

            <form class="search-form" action="{% url 'appname:search' %}" method="get">
                <input type="text" name="q" placeholder="Поиск..." value="{{ query|default:'' }}">
            </form>

            {% if user.is_authenticated %}
                <div class="user-menu">
                    <button class="user-btn" onclick="toggleUserMenu(event)">
                        <span class="user-avatar-letter">{{ user.username|first|upper }}</span>
                        <span class="user-name">{{ user.username }}</span>
                        <span class="user-caret">▾</span>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <a href="{% url 'appname:profile' %}">👤 Мой профиль</a>
                        <a href="{% url 'account_change_password' %}">🔒 Сменить пароль</a>
                        {% if user.is_staff %}
                            <a href="/admin/">⚙️ Админ-панель</a>
                        {% endif %}
                        <hr>
                        <a href="{% url 'account_logout' %}">🚪 Выйти</a>
                    </div>
                </div>
            {% else %}
                <div class="user-menu">
                    <a href="{% url 'account_login' %}" class="btn-login">Войти</a>
                    <a href="{% url 'account_signup' %}" class="btn-register">Регистрация</a>
                </div>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>© 2025 AnimeManga</footer>
    <script>
    /* Генерация частиц для любой страницы с id="authParticles" или id="particles" */
    (function () {
        const containers = document.querySelectorAll('.auth-particles, .particles');
        containers.forEach(function (container) {
            if (container.dataset.filled === '1') return;
            container.dataset.filled = '1';
            const COUNT = 35;
            for (let i = 0; i < COUNT; i++) {
                const p = document.createElement('span');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.animationDuration = (6 + Math.random() * 6) + 's';
                p.style.opacity = 0.2 + Math.random() * 0.6;
                const size = 2 + Math.random() * 4;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                container.appendChild(p);
            }
        });
    })();
    
    function toggleUserMenu(e) {
        e.stopPropagation();
        const menu = document.getElementById('userDropdown');
        if (menu) menu.classList.toggle('open');
    }
    document.addEventListener('click', function () {
        const menu = document.getElementById('userDropdown');
        if (menu) menu.classList.remove('open');
    });
    </script>
</body>
</html>
